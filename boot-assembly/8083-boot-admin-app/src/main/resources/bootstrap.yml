server:
  port: 8082
  servlet:
    context-path: /sys

spring:
  application:
    name: omni-app
  #环境 dev|test|prod
  profiles:
    active: dev
  messages:
    encoding: UTF-8
    basename: i18n/messages_ai,i18n/messages_mp,i18n/messages_message,i18n/messages_payment,i18n/messages_common
  validations:
    basename:
      - i18n/validation_ai
      - i18n/validation_mp
      - i18n/validation_message
      - i18n/validation_payment
      - i18n/validation_common
  cloud:
    nacos:
      discovery:
        metadata:
          management:
            context-path: ${server.servlet.context-path}/actuator
        server-addr: ${nacos_host:127.0.0.1}:${nacos_port:8848}
        namespace: bootcloud
        service: omni-app
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        namespace: ${spring.cloud.nacos.discovery.namespace}
        group: BOOT_GROUP
        file-extension: yaml
        #指定共享配置，且支持动态刷新
        extension-configs:
          - data-id: datasource.yaml
            group: ${spring.cloud.nacos.config.group}
            refresh: true
          - data-id: common.yaml
            group: ${spring.cloud.nacos.config.group}
            refresh: true

##################################################
# magic api configuration
##################################################
magic-api:
  # 一定要关掉cors
  support-cross-domain: false
  # 开发端前缀
  web: /web
  # 接口前缀
  prefix: /api
  # 远程部署推送的秘钥
  secret-key: magic
  # 开发端的登录
  security:
    username: admin
    password: admin123
  # 脚本保存位置
  resource:
    type: database
    table-name: magic_api_file
    prefix: magic
  # 脚本备份配置
  backup:
    enable: true
    table-name: magic_api_backup
    max-history: 100
  # 数据库字段camel case,  一般这种项目, 我们让java bean里字段名称和数据库一致
  # sql-column-case: camel
  # 数据库操作的cache: todo
  # 默认应答包装格式, 可额外增加字段,timestamp, requestTime,
  response: |-
    {
      code: code,
      msg: message,
      data,
      executeTime,
    }

  # async 异步执行的线程池大小
  thread-pool-executor-size: 8
  # 应答码映射
  response-code:
    exception: 500
    success: 0
    invalid: 400
  show-sql: true
  show-url: true
  crud:
    logic-delete-column: del_flag
    logic-delete-value: 1
  # 定时任务插件
  task:
    thread-name-prefix: magic-task- #线程池名字前缀
    pool:
      size: 8 #线程池大小，默认值为CPU核心数
    shutdown:
      awaitTermination: false #关闭时是否等待任务执行完毕，默认为false
      awaitTerminationPeriod: 10s # 关闭时最多等待任务执行完毕的时间
  # 文档
  springdoc:
    version: 1.0
    description: 接口信息
    title: MagicAPI Swagger Docs
    name: MagicAPI 接口
    location: /v2/swagger2.json
    groupName: magic-api
