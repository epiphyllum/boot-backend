server:
  port: 8082

apijson:
  db-type: MYSQL
  schema: bootdb
  table-map:
    User: sys_user

---
#开发环境
spring:
  config:
    activate:
      on-profile: dev
mybatis-plus:
  configuration:
    #mybatis-plus配置控制台打印完整带参数SQL语句
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
---
#生产环境
spring:
  config:
    activate:
      on-profile: prd
server:
  tomcat:
    threads:
      max: 1000
      min-spare: 30
    accept-count: 100
    connection-timeout: 2000
    uri-encoding: utf-8
    max-connections: 8192
---

spring:
  application:
    name: mono-app
  profiles:
    active: dev
  messages:
    encoding: UTF-8
    basename: i18n/messages_ai,i18n/messages_mp,i18n/messages_message,i18n/messages_payment,i18n/messages_common
  validations:
    basename:
      - i18n/validation_ai
      - i18n/validation_mp
      - i18n/validation_message
      - i18n/validation_payment
      - i18n/validation_common
  cloud:
    nacos:
      discovery:
        metadata:
          management:
            context-path: ${server.servlet.context-path}/actuator
        server-addr: ${nacos_host:127.0.0.1}:${nacos_port:8848}
        namespace: bootcloud
        service: omni-app
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        namespace: ${spring.cloud.nacos.discovery.namespace}
        group: BOOT_GROUP
        file-extension: yaml
        #指定共享配置，且支持动态刷新
        extension-configs:
          - data-id: datasource.yaml
            group: ${spring.cloud.nacos.config.group}
            refresh: true
          - data-id: common.yaml
            group: ${spring.cloud.nacos.config.group}
            refresh: true
          - data-id: mono-magic.yaml
            group: ${spring.cloud.nacos.config.group}
            refresh: true
